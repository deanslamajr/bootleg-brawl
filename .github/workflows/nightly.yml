name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  balance-and-pacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tools balance
      - run: |
          for stage in game-0 game-1 game-2; do
            for seed in 1 2 3; do
              pnpm tools metrics "$stage" --players=1,2,4 --seed="$seed" --strict
            done
          done
      - run: pnpm tools perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics
          path: generated/metrics

  frame-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The deny list is private (D61). Without the secret, validate fails and says why.
      - name: Write the forbidden-terms deny list
        env:
          FORBIDDEN_TERMS_JSON: ${{ secrets.FORBIDDEN_TERMS_JSON }}
        run: |
          if [ -n "$FORBIDDEN_TERMS_JSON" ]; then
            printf '%s' "$FORBIDDEN_TERMS_JSON" > content/forbidden-terms.json
          fi
      - run: pnpm content && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=perf
