name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  balance-and-pacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tools balance
      - run: |
          for stage in game-0 game-1 game-2; do
            pnpm tools metrics "$stage" --players=2 --strict
          done
      - run: pnpm tools perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics
          path: generated/metrics

  frame-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=perf
