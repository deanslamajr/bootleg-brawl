name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The deny list is private (D61). Without the secret, validate fails and says why.
      - name: Write the forbidden-terms deny list
        env:
          FORBIDDEN_TERMS_JSON: ${{ secrets.FORBIDDEN_TERMS_JSON }}
        run: |
          if [ -n "$FORBIDDEN_TERMS_JSON" ]; then
            printf '%s' "$FORBIDDEN_TERMS_JSON" > content/forbidden-terms.json
          fi
      # export -> bake -> pack -> validate, including the forbidden-terms scan and bundle budgets.
      - run: pnpm content
      - name: Rig poses are up to date
        run: |
          pnpm tools gen-rigs
          git diff --exit-code -- content/rigs
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Golden replays on two different runners: the state hash per checkpoint must match the
  # recorded hash on both, which is the determinism guarantee rollback netcode will need.
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tools verify-golden

  e2e:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test --project=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results

  # Deploys from main once the deployment variables and secrets exist (see README, Deploying).
  deploy:
    needs: [check, determinism, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Cloud identifiers are secrets, not committed text (D63).
      IMAGE: ${{ secrets.IMAGE_REPO }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}
      - run: gcloud auth configure-docker "${IMAGE%%/*}" --quiet
      - run: docker build --platform linux/amd64 -t "$IMAGE" . && docker push "$IMAGE"
      - run: kubectl -n bootleg-brawl set image deployment/bootleg web="$IMAGE"
      - run: kubectl -n bootleg-brawl rollout status deployment/bootleg --timeout=180s
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test the live URL
        run: pnpm exec playwright test --project=smoke
        env:
          SMOKE_URL: https://${{ vars.BOOTLEG_HOST || 'bootleg.llmgag.world' }}/
