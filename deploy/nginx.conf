server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Pre-compressed .gz files sit next to every text asset (see the build's compress step).
  gzip_static on;
  gzip on;
  gzip_vary on;
  # Requests arrive through the Google load balancer (with a Via header), which nginx skips by default.
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml audio/wav;

  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    application/json json;
    image/png png;
    image/svg+xml svg;
    audio/wav wav;
    audio/ogg ogg;
    audio/opus opus;
    application/wasm wasm;
  }

  # add_header in a location replaces the server-level set, so each location repeats nosniff.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Vite assets and content bundles are content-hashed: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /bundles/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The manifest names the current bundles, so it is always revalidated.
  location = /manifest.json {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ =404;
  }
}
