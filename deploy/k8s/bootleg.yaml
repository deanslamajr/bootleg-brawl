# Applied by `pnpm deploy`, which replaces IMAGE with the pushed image tag and HOSTNAME with the
# game's host (default bootleg.llmgag.world). Modeled on Marble Melancholy's manifests.
apiVersion: v1
kind: Namespace
metadata:
  name: bootleg-brawl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootleg
  namespace: bootleg-brawl
  labels:
    app: bootleg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bootleg
  template:
    metadata:
      labels:
        app: bootleg
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: IMAGE
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bootleg
  namespace: bootleg-brawl
spec:
  selector:
    app: bootleg
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: bootleg-health-check
  namespace: bootleg-brawl
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: bootleg
---
# Attaches to the shared Gateway (its listener allows routes from all namespaces). TLS comes from
# the Gateway's Certificate Manager map: add a certificate and map entry for the host first.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bootleg
  namespace: bootleg-brawl
spec:
  parentRefs:
    - kind: Gateway
      name: external-https
      namespace: default
  hostnames:
    - "HOSTNAME"
  rules:
    # No per-rule timeouts: the shared Gateway rejects them and then stops programming every route.
    - backendRefs:
        - name: bootleg
          port: 80
